[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-bridge"
version = "0.1.0"
description = "CLI tool dispatching tasks to local Devin AI sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
]

[project.scripts]
bridge = "session_bridge.cli.bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/session_bridge"]

[tool.pytest.ini_options]
markers = ["e2e: live tests requiring local devin binary and ACP"]
timeout = 60
